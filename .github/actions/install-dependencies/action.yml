name: "Install dependencies"
description: "Prepare repository and all dependencies"

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        # Pinned: Foundry 1.10 no longer resolves the unmapped
        # @openzeppelin/contracts/ import in EntryPointSimulations07, so
        # `pnpm install` (build:contracts) fails. 1.9.0 is the last version CI
        # passed with.
        version: v1.9.0
