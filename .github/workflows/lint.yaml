name: Lint the Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run format check
        run: pnpm run lint:fix && pnpm run lint

      - uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: 'chore: format'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      # Covers the unit tests, which the build config excludes so they are not
      # emitted. Runs after the format commit so a type error does not discard
      # the formatting fixes.
      - name: Type check
        run: pnpm run typecheck