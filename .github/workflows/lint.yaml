name: Lint the Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# The auto-commit step below pushes the formatting fix back to the PR branch.
permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # persist-credentials stays on, against the usual advice: the
      # auto-commit step below pushes with the credentials this leaves in the
      # local git config, and turning it off silently breaks that push.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run format check
        run: pnpm run lint:fix && pnpm run lint

      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: 'chore: format'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      # Covers the unit tests, which the build config excludes so they are not
      # emitted. Runs after the format commit so a type error does not discard
      # the formatting fixes.
      - name: Type check
        run: pnpm run typecheck