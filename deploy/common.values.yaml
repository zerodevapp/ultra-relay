application:
  applicationName: ultra-relay

  labels:
    app: ultra-relay
    component: ultra-relay

  serviceMonitor:
    enabled: true
    endpoints:
      - interval: 15s
        path: /metrics
        port: http

  rbac:
    enabled: true
    serviceAccount:
      enabled: true
      name: ultra-relay

  deployment:
    enabled: true
    reloadOnChange: true
    configMapChecksum: true
    serviceAccountName: ultra-relay
    # image.repository (ECR registry, references the OCL AWS account) is set from
    # zerodev-helm-charts' private $secrets values, not committed in this public repo.
    # Dockerfile never sets a non-root USER, so the chart's default runAsNonRoot/readOnlyRootFilesystem would fail admission.
    containerSecurityContext:
      readOnlyRootFilesystem: false
      runAsNonRoot: false
    # No env-var binding for executor/utility private keys upstream; shell wrapper expands envFrom into flags.
    command:
      - /bin/sh
      - -c
    args:
      - >-
        exec pnpm start run
        --config /configs/alto-config.json
        --executor-private-keys "$EXECUTOR_PRIVATE_KEYS"
        --utility-private-key "$UTILITY_PRIVATE_KEY"
    envFrom:
      ultra-relay-secrets:
        type: secret
        name: ultra-relay-secrets
    ports:
      - containerPort: 3000
        name: http
        protocol: TCP
    # Long grace period so in-flight mempool restoration (CONTEXT.md) finishes before SIGKILL.
    terminationGracePeriodSeconds: 60
    livenessProbe:
      enabled: true
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      enabled: true
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
    volumeMounts:
      config:
        mountPath: /configs/alto-config.json
        subPath: alto-config.json
    volumes:
      config:
        configMap:
          name: ultra-relay-config
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: ultra-relay

  service:
    enabled: true
    ports:
      - port: 3000
        targetPort: 3000
        protocol: TCP
        name: http

  configMap:
    enabled: true
